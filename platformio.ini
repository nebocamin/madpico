; madpico - NomadNet compatible page node for the Raspberry Pi Pico 2 W
; based on microReticulum (C++ port of Reticulum)
;
; All dependencies are pinned to known-good commits/versions.

[platformio]
default_envs = pico2w

[env:pico2w]
; arduino-pico core (Earle Philhower) via the maxgerhardt platform fork.
; This platform commit pins arduino-pico to fd65f6d4.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
; 4 MB flash: 1 MB for LittleFS (identity, pages)
board_build.filesystem_size = 1m
monitor_speed = 115200

build_unflags =
	-std=gnu++11
	-std=gnu++14
	-fno-exceptions
build_flags =
	-std=gnu++17
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
	-Wno-missing-field-initializers -Wno-format -Wno-unused-variable -Wno-unused-but-set-variable -Wno-unused-function -Wno-unused-parameter
	-DMSGPACK_USE_BOOST=OFF
	-DRNS_USE_FS
	; Keep the path, identity and packet hash tables in RAM instead of flash.
	; microReticulum only initialises the flash-backed variants in transport
	; mode, so for a plain endpoint they would never work. It also saves the
	; flash from wear (announces arrive constantly on public networks).
	-DRNS_PERSIST_PATHS=0
	-DRNS_PERSIST_KNOWN_DESTINATIONS=0
	-DRNS_PERSIST_HASHLIST=0
	; Cap at VERBOSE: DEBUG/TRACE (which print private keys, among other
	; things) are not compiled in at all
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_VERBOSE
	-DRNS_DEBUG_METRICS

lib_deps =
	bblanchon/ArduinoJson@7.4.3
	hideakitai/MsgPack@0.4.2
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/attermann/microStore.git#d5282e6d8849dfd3a2ba9999a5ef403310ed292d
	https://github.com/attermann/microReticulum.git#5dd9af9c0559271c0efba97ed24cf4d8600c90a6
